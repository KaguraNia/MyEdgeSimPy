# Example: real taxi trajectories (Rome/San Francisco stand-in) instead of synthetic routes.
simulation:
  seed: 42
  tick_seconds: 1.0
  duration_steps: 600

topology:
  source: grid
  grid_x: 5
  grid_y: 5
  link_delay_ms: 5.0
  link_bandwidth_mbps: 500.0

mobility:
  source: taxi
  dataset: rome
  dataset_path: examples/taxi_sample.csv
  vehicles: 3
  speed_kmh: 35.0
  cell_size_m: 500.0

migration:
  strategy: reactive

output:
  directory: results
  tag: taxi_sample