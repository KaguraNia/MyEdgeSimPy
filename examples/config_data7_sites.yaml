# Example: real base-station sites (DATA7 stand-in) instead of a synthetic grid.
simulation:
  seed: 42
  tick_seconds: 1.0
  duration_steps: 600

topology:
  source: sites
  sites_path: examples/data7_sites_sample.csv
  sites_k_neighbors: 3
  link_delay_ms: 4.0
  link_bandwidth_mbps: 500.0
  wireless_delay_ms: 2.0
  registry_cell: null

mobility:
  source: synthetic
  vehicles: 8
  speed_kmh: 45.0
  cell_size_m: 500.0

migration:
  strategy: proactive_delta

output:
  directory: results
  tag: data7_sample