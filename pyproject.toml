[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myedgesimpy"
version = "0.1.0"
description = "Service-state migration for MEC: a simulation prototype built on EdgeSimPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.scripts]
myedgesimpy = "myedgesimpy.cli:main"

[tool.setuptools.packages.find]
include = ["myedgesimpy*"]