# Real DATA7 topology and SUMO mobility (Pisa).
# Prepared by scripts/prepare_data7.py: 30 gNBs selected from 187, 162 vehicles.
simulation:
  seed: 42
  tick_seconds: 1.0
  duration_steps: 1800

topology:
  source: data7
  data7_cells_path: data/raw/data7/prepared/cells.csv
  sites_k_neighbors: 3
  link_delay_ms: 5.0
  link_bandwidth_mbps: 500.0
  wireless_delay_ms: 2.0
  registry_cell: null

mobility:
  source: data7
  dataset: data7
  dataset_path: data/raw/data7/prepared/traces.csv
  vehicles: 12
  speed_kmh: 40.0
  # Median nearest-neighbour distance between the 30 selected DATA7 cells.
  cell_size_m: 378.0

services:
  enabled:
    - navigation
    - infotainment
    - alert
    - traffic_analytics
  state_growth_factor: 1.0

migration:
  strategy: reactive
  base_model: per_node
  restore_ms_per_mb: 5.0
  base_maintenance: none
  base_sync_interval_steps: 600
  base_sync_mode: delta
  lookahead_steps: 12
  cutover_steps: 2
  min_transfer_mb: 0.0
  only_stateful: false
  capacity_guard: true

metrics:
  sla_latency_ms: 60.0
  sample_every_steps: 1

output:
  directory: results
  tag: data7_reactive
