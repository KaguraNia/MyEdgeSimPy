# Default experiment: a 6x6 cellular grid, 12 vehicles at 40 km/h, four MEC services.
simulation:
  seed: 42
  tick_seconds: 1.0
  duration_steps: 1800

topology:
  source: grid          # "grid" (synthetic) or "sites" (real base stations, e.g. DATA7)
  grid_x: 6
  grid_y: 6
  link_delay_ms: 5.0
  link_bandwidth_mbps: 500.0
  wireless_delay_ms: 2.0
  server:
    model_name: mec-standard
    cpu: 128
    memory_mb: 262144
    disk_mb: 2097152
    max_concurrent_layer_downloads: 4
  registry_cell: [0, 0]

mobility:
  source: synthetic     # "synthetic" or "taxi"
  dataset: synthetic    # "synthetic" | "rome" | "sf"
  dataset_path: null
  vehicles: 12
  speed_kmh: 40.0
  cell_size_m: 500.0
  trip_min_cells: 3
  trip_max_cells: 8

services:
  enabled:
    - navigation
    - infotainment
    - alert
    - traffic_analytics
  state_growth_factor: 1.0

migration:
  strategy: reactive    # reactive | reactive_delta | proactive | proactive_delta | custom
  lookahead_steps: 12
  cutover_steps: 2
  min_transfer_mb: 0.0
  only_stateful: false
  capacity_guard: true

metrics:
  sla_latency_ms: 60.0
  sample_every_steps: 1

output:
  directory: results
  tag: default