# Real Rome taxi traces (CRAWDAD roma/taxi, via a public mirror).
# The raw format is  id;timestamp;POINT(lon lat);  the loader converts it to
# (latitude, longitude). A subset of taxis is used for a tractable simulation.
simulation:
  seed: 42
  tick_seconds: 1.0
  duration_steps: 1800

topology:
  source: grid
  grid_x: 16
  grid_y: 16
  link_delay_ms: 5.0
  link_bandwidth_mbps: 500.0
  wireless_delay_ms: 2.0
  server:
    model_name: mec-standard
    cpu: 128
    memory_mb: 262144
    disk_mb: 2097152
    max_concurrent_layer_downloads: 4
  registry_cell: [0, 0]

mobility:
  source: taxi
  dataset: rome
  dataset_path: data/raw/rome_taxi/rome_subset.csv
  vehicles: 12
  speed_kmh: 40.0
  # The Rome bounding box is ~33 km across and is mapped onto 16 cells.
  cell_size_m: 2100.0

services:
  enabled:
    - navigation
    - infotainment
    - alert
    - traffic_analytics
  state_growth_factor: 1.0

migration:
  strategy: reactive
  base_model: per_node
  restore_ms_per_mb: 5.0
  base_maintenance: none
  base_sync_interval_steps: 600
  base_sync_mode: delta
  lookahead_steps: 12
  cutover_steps: 2

metrics:
  sla_latency_ms: 60.0
  sample_every_steps: 1

output:
  directory: results
  tag: rome_taxi_reactive
